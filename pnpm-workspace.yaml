minimumReleaseAgeExcludePrune: true

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1

shellEmulator: true

packages:
  - apps/*
  - packages/*

allowBuilds:
  # better-sqlite3 ships prebuilt bindings in its tarball; building from
  # source is unnecessary (and requires a MSVC toolchain)
  better-sqlite3: false
  esbuild: true

