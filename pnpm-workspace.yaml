shellEmulator: true

trustPolicy: no-downgrade

packages:
  - apps/*
  - packages/*

allowBuilds:
  # better-sqlite3 ships prebuilt bindings in its tarball; building from
  # source is unnecessary (and requires a MSVC toolchain)
  better-sqlite3: false
  esbuild: true

catalog:
  '@antfu/eslint-config': ^9.3.0
  '@base-ui/react': ^1.7.0
  '@fontsource-variable/inter': ^5.3.0
  '@hono/node-server': ^2.1.1
  '@hono/zod-validator': ^0.9.0
  '@tailwindcss/vite': ^4.3.3
  '@types/better-sqlite3': ^9.6.0
  '@types/node': ^24.13.3
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  '@vitejs/plugin-react': ^6.1.0
  better-sqlite3: ^13.0.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-kit: ^0.31.10
  drizzle-orm: ^0.45.2
  eslint: ^10.8.1
  hono: ^4.13.3
  lucide-react: ^1.33.0
  nanoid: ^6.0.1
  next-themes: ^0.4.6
  react: ^19.2.8
  react-dom: ^19.2.8
  react-router: ^8.3.0
  shiki: ^4.4.3
  sonner: ^2.0.8
  tailwind-merge: ^3.6.0
