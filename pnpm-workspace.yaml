packages:
  - apps/*
  - packages/*

allowBuilds:
  better-sqlite3: true
  esbuild: true

catalog:
  # toolchain
  eslint: ^10.9.0
  '@antfu/eslint-config': ^9.3.0
  '@eslint-react/eslint-plugin': ^5.6.0
  eslint-plugin-react-refresh: ^0.5.4
  eslint-plugin-jsx-a11y: ^6.10.2
  typescript: 6.0.3
  '@types/node': ^24.13.3

  # server
  hono: ^4.13.3
  '@hono/node-server': ^2.1.1
  '@hono/zod-validator': ^0.9.0
  zod: ^4.4.3
  drizzle-orm: ^0.45.2
  drizzle-kit: ^0.31.10
  better-sqlite3: ^13.0.3
  '@types/better-sqlite3': ^9.6.0
  nanoid: ^6.0.1
  tsx: ^4.23.12

  # web
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.4
  react-router: ^8.3.0
  vite: ^8.2.2
  '@vitejs/plugin-react': ^6.1.0
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  shiki: ^4.4.3
  sonner: ^2.0.8
  lucide-react: ^1.33.0
  tw-animate-css: ^1.4.0

minimumReleaseAgeExclude:
  - eslint@10.9.0
